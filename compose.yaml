services:
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./assets:/app/assets:ro
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: larpcard
      POSTGRES_USER: larpcard
      POSTGRES_PASSWORD: larpcard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larpcard -d larpcard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LARPCARD_POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${LARPCARD_REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
