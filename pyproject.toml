[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "larpcard"
version = "0.1.0"
description = "A premium Discord collectible card game."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "discord.py>=2.5,<3",
    "pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<9",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
admin = [
    "PySide6>=6.8,<7",
]

[project.scripts]
larpcard = "larpcard.main:main"
larpcard-import-catalog = "larpcard.tools.catalog_import:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["larpcard"]
